<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">CDOR</title>
  <desc id="d">Plataforma de chat con IA — web, Android e iOS sincronizados sobre una API propia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a14"/><stop offset="0.55" stop-color="#120f1e"/><stop offset="1" stop-color="#171128"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <ellipse cx="930" cy="150" rx="320" ry="190" fill="url(#glow)"/>

  <!-- burbujas de chat sincronizadas entre dispositivos -->
  <g opacity="0.95">
    <rect x="790" y="60" width="200" height="52" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="url(#accent)" stroke-width="1.4"/>
    <circle cx="812" cy="86" r="10" fill="url(#accent)" opacity="0.7"/>
    <rect x="832" y="78" width="130" height="7" rx="3.5" fill="#ffffff" opacity="0.35"/>
    <rect x="832" y="90" width="90" height="7" rx="3.5" fill="#ffffff" opacity="0.22"/>

    <rect x="860" y="122" width="220" height="52" rx="16" fill="url(#accent)" fill-opacity="0.14" stroke="url(#accent)" stroke-width="1.4"/>
    <rect x="882" y="140" width="150" height="7" rx="3.5" fill="#ffffff" opacity="0.5"/>
    <rect x="882" y="152" width="110" height="7" rx="3.5" fill="#ffffff" opacity="0.3"/>

    <rect x="800" y="184" width="190" height="52" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="url(#accent)" stroke-width="1.4"/>
    <circle cx="822" cy="210" r="10" fill="url(#accent)" opacity="0.7"/>
    <rect x="842" y="202" width="120" height="7" rx="3.5" fill="#ffffff" opacity="0.35"/>
    <rect x="842" y="214" width="80" height="7" rx="3.5" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- iconos de dispositivo: web / android / ios, unidos por una línea de sync -->
  <g stroke="url(#accent)" stroke-width="1.6" fill="none" opacity="0.55">
    <path d="M1010,70 C1040,110 1040,190 1010,230" stroke-dasharray="3 6"/>
  </g>
  <rect x="1010" y="66" width="30" height="20" rx="3" stroke="url(#accent)" stroke-width="1.6" fill="none" opacity="0.6"/>
  <rect x="1015" y="140" width="20" height="32" rx="4" stroke="url(#accent)" stroke-width="1.6" fill="none" opacity="0.6"/>
  <rect x="1015" y="196" width="20" height="34" rx="5" stroke="url(#accent)" stroke-width="1.6" fill="none" opacity="0.6"/>

  <text x="62" y="128" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="#f4f1ff">CDOR</text>
  <text x="66" y="168" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#c4b5fd">cdor.online</text>
  <text x="66" y="200" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="500" fill="#a99fc4">Chat con IA — web, Android e iOS, siempre en la misma conversación</text>

  <rect x="64" y="228" width="130" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.2"/><text x="129.0" y="249" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f4f1ff">Monorepo</text>
  <rect x="202" y="228" width="120" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.2"/><text x="262.0" y="249" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f4f1ff">Tauri 2</text>
  <rect x="330" y="228" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.2"/><text x="405.0" y="249" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#f4f1ff">SvelteKit</text>
</svg>
