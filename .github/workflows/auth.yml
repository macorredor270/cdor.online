name: Authentication

on:
  pull_request:
    paths:
      - "apps/platform/drizzle/**"
      - "apps/platform/src/hooks.server.ts"
      - "apps/platform/src/lib/server/auth/**"
      - "apps/platform/src/lib/server/email/**"
      - "apps/platform/src/lib/server/db/repositories/devices.ts"
      - "apps/platform/src/lib/server/services/devices.ts"
      - "apps/platform/src/routes/api/v1/auth/**"
      - "apps/platform/tests/auth/**"
      - "packages/contracts/src/auth.ts"
      - "scripts/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/auth.yml"
  push:
    branches: [main]
    paths:
      - "apps/platform/drizzle/**"
      - "apps/platform/src/hooks.server.ts"
      - "apps/platform/src/lib/server/auth/**"
      - "apps/platform/src/lib/server/email/**"
      - "apps/platform/src/lib/server/db/repositories/devices.ts"
      - "apps/platform/src/lib/server/services/devices.ts"
      - "apps/platform/src/routes/api/v1/auth/**"
      - "apps/platform/tests/auth/**"
      - "packages/contracts/src/auth.ts"
      - "scripts/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/auth.yml"

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/platform check
      - run: pnpm db:check
      - run: pnpm test:auth
      - run: ./scripts/db/run-test-command.sh test:auth mariadb
      - run: pnpm scan:client-secrets
      - if: always()
        run: docker compose --project-name cdor-local --file infra/local/compose.mysql.yml stop
