name: AI providers

on:
  pull_request:
    paths:
      - "apps/platform/src/lib/server/ai/**"
      - "apps/platform/scripts/ai/**"
      - "apps/platform/tests/ai/**"
      - "apps/platform/src/lib/server/config/**"
      - "scripts/scan-client-secrets.mjs"
      - "package.json"
      - "apps/platform/package.json"
      - ".github/workflows/ai.yml"
  push:
    branches: [main]
    paths:
      - "apps/platform/src/lib/server/ai/**"
      - "apps/platform/scripts/ai/**"
      - "apps/platform/tests/ai/**"
      - "apps/platform/src/lib/server/config/**"
      - "scripts/scan-client-secrets.mjs"
      - "package.json"
      - "apps/platform/package.json"
      - ".github/workflows/ai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ai
      - run: pnpm --dir apps/platform check
      - run: pnpm scan:client-secrets

  external-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      NVIDIA_DEFAULT_MODEL: meta/llama-3.1-8b-instruct
      NVIDIA_REQUEST_TIMEOUT_MS: "120000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @cdor/platform...
      - run: pnpm smoke:nvidia
