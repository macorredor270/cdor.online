[package]
name = "cdor-mobile"
version = "0.1.0"
description = "Núcleo nativo de CDOR Mobile"
authors = ["CDOR"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "cdor_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
futures-util = "0.3.33"
rusqlite = { version = "=0.40.1", features = ["bundled"] }
reqwest = { version = "=0.13.4", features = ["blocking", "json", "stream"] }
rustls = { version = "=0.23.42", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-secure-session = { path = "plugins/secure-session" }
thiserror = "2.0.18"
webpki-roots = "=1.0.9"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-opener = "2.5.4"
