<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="32x32 48x48" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4A148C" />
    <meta name="application-name" content="MAC" />
    <meta name="apple-mobile-web-app-title" content="MAC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta property="og:site_name" content="MAC" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:image" content="https://cdor.online/branding/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MAC, asistente virtual de inteligencia artificial" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cdor.online/branding/og-image.png" />
    <!-- Apply the stored theme before first paint to avoid a dark flash for
         light-theme users. Keep in sync with src/lib/client/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem("cdor-theme");
        if (t === "system") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
